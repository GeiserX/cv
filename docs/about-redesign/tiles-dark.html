<style>
.co-tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
    gap: 12px;
    margin: 1.5em 0 0;
}
.co-tile {
    aspect-ratio: 1;
    background: #1d2024;
    border: 1px solid rgba(255, 255, 255, .07);
    border-radius: 10px;
    padding: 10%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: border-color .25s ease, background-color .25s ease;
}
.co-tile:hover { border-color: rgba(255, 255, 255, .2); background: #212429; }
.co-tile .co-img { max-width: 100%; max-height: 58%; object-fit: contain; transform: scale(var(--z, 1)); }
.co-img {
    display: block;
    margin: 0;
    filter: brightness(0) invert(.92);
    opacity: .7;
    transition: filter .25s ease, opacity .25s ease;
}
.co-img.co-detail { filter: grayscale(1) invert(.92) contrast(1.4); }
.co-img.co-paper { filter: grayscale(1) invert(1) contrast(1.4); mix-blend-mode: screen; }
.co-img.co-plate { filter: grayscale(1) contrast(1.8); mix-blend-mode: screen; }
.co-tile:hover .co-img { filter: none; opacity: 1; }
.co-tile:hover .co-img.co-lift { filter: invert(1) hue-rotate(180deg); }
.co-tile:hover .co-img.co-still { filter: grayscale(1) contrast(1.8); }
@media (max-width: 480px) {
    .co-tiles { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .co-tile { padding: 12%; border-radius: 8px; }
}
</style>
